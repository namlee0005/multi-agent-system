# Multi-Agent Project Advisor Configuration
# Supported backends: claude, gemini, openai

defaults:
  backend: claude
  model: anthropic/claude-opus-4-6
  temperature: 0.7

agents:
  planner:
    backend: claude
    model: anthropic/claude-opus-4-6
    temperature: 0.5  # More deterministic for orchestration

  researcher:
    backend: claude
    model: anthropic/claude-opus-4-6
    temperature: 0.7

  architect:
    backend: claude
    model: anthropic/claude-opus-4-6
    temperature: 0.7

  backend_dev:
    backend: claude
    model: anthropic/claude-opus-4-6
    temperature: 0.8

  frontend_dev:
    backend: claude
    model: anthropic/claude-opus-4-6
    temperature: 0.8

  devops:
    backend: claude
    model: anthropic/claude-opus-4-6
    temperature: 0.7

  security:
    backend: claude
    model: anthropic/claude-opus-4-6
    temperature: 0.6

  skeptic:
    backend: claude
    model: anthropic/claude-opus-4-6
    temperature: 0.9  # More creative/challenging


# Backend CLI command templates
backends:
  claude:
    command: "/home/ben/.npm-global/bin/claude"
    args: ["--print", "--permission-mode", "bypassPermissions"]
    input_mode: stdin  # pipe prompt via stdin

  gemini:
    command: "gemini"
    args: ["-m", "{model}", "--yolo"]
    input_mode: stdin

  openai:
    command: "openai"
    args: ["api", "chat.completions.create", "-m", "{model}"]
    input_mode: stdin

debate:
  max_rounds: 2
  min_agents: 3
  max_agents: 5
  synthesis_format: markdown
