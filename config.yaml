agents:
  architect:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.7
  backend_dev:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.8
  devops:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.7
  frontend_dev:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.8
  planner:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.5
  researcher:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.7
  security:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.6
  skeptic:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.9
backends:
  claude:
    args:
    - --print
    - --permission-mode
    - bypassPermissions
    command: /home/ben/.npm-global/bin/claude
    input_mode: stdin
  gemini:
    args:
    - -m
    - '{model}'
    - --yolo
    command: gemini
    input_mode: stdin
cli_timeout_s: 120
debate:
  max_agents: 5
  max_rounds: 2
  min_agents: 3
  synthesis_format: markdown
defaults:
  backend: claude
  model: claude-sonnet-4-6
  temperature: 0.7
