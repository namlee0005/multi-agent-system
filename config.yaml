agents:
  Architect:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.7
  BackendDev:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.8
  CodeReviewer:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.3
  DevOps:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.7
  FrontendDev:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.8
  Planner:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.5
  Researcher:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.7
  Security:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.6
  Skeptic:
    backend: claude
    model: claude-sonnet-4-6
    temperature: 0.9
backends:
  claude:
    args:
    - --print
    - --permission-mode
    - bypassPermissions
    command: /home/ben/.npm-global/bin/claude
    input_mode: stdin
  gemini:
    args:
    - -m
    - '{model}'
    - --yolo
    command: gemini
    input_mode: stdin
cli_timeout_s: 120
debate:
  max_agents: 5
  max_rounds: 2
  min_agents: 3
  synthesis_format: markdown
defaults:
  backend: claude
  model: claude-sonnet-4-6
  temperature: 0.7