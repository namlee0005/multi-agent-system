# Multi-Agent Project Advisor Configuration
# Supported backends: claude, gemini, openai

defaults:
  backend: gemini
  model: gemini-2.5-flash # Good, fast default
  temperature: 0.7

agents:
  planner:
    backend: gemini
    model: gemini-3.1-pro-preview # Smartest agent for orchestration
    temperature: 0.5

  researcher:
    backend: gemini
    model: gemini-2.5-flash-lite # Needs to be fast
    temperature: 0.7

  architect:
    backend: gemini
    model: gemini-3.1-pro-preview # Smartest agent for design
    temperature: 0.7

  backend_dev:
    backend: claude
    model: anthropic/claude-sonnet-4-6
    temperature: 0.8

  frontend_dev:
    backend: claude
    model: anthropic/claude-sonnet-4-6
    temperature: 0.8

  devops:
    backend: gemini
    model: gemini-2.5-flash
    temperature: 0.7

  security:
    backend: gemini
    model: gemini-2.5-flash
    temperature: 0.6

  skeptic:
    backend: gemini
    model: gemini-3-pro-preview # Needs to be creative and powerful
    temperature: 0.9

# Backend CLI command templates
backends:
  claude:
    command: "/root/.local/bin/claude"
    args: ["--print"]
    input_mode: stdin  # pipe prompt via stdin

  gemini:
    command: "gemini"
    args: ["-m", "{model}", "--yolo"]
    input_mode: stdin

  openai:
    command: "openai"
    args: ["api", "chat.completions.create", "-m", "{model}"]
    input_mode: stdin

debate:
  max_rounds: 2
  min_agents: 3
  max_agents: 5
  synthesis_format: markdown
